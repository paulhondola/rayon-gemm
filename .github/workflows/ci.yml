name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Nightly (Clippy, Format, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmark

      - name: Check Formatting
        run: cargo fmt --manifest-path benchmark/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path benchmark/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --manifest-path benchmark/Cargo.toml

  web:
    name: Web (Lint & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Biome Lint & Format Check
        run: bunx @biomejs/biome check src
        working-directory: web

      - name: TypeScript Typecheck
        run: bun run typecheck
        working-directory: web
