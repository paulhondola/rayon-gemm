pre-commit:
  parallel: true
  commands:
    benchmark-fmt:
      root: "benchmark/"
      glob: "*.rs"
      run: cargo fmt --manifest-path Cargo.toml
      stage_fixed: true
    benchmark-clippy:
      root: "benchmark/"
      glob: "*.rs"
      run: cargo clippy --manifest-path Cargo.toml --all-targets --all-features -- -D warnings
    benchmark-test:
      root: "benchmark/"
      glob: "*.rs"
      run: cargo test --manifest-path Cargo.toml
    frontend-lint:
      root: "web/"
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx @biomejs/biome check --write {staged_files}
      stage_fixed: true
    frontend-typecheck:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: bun run typecheck
